<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4FC4"/>
      <stop offset="1" stop-color="#2F6FED"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80,80)">
    <rect width="96" height="96" rx="22" fill="#ffffff"/>
    <rect x="10" y="10" width="76" height="76" rx="16" fill="none"/>
    <g transform="translate(6,6) scale(0.42)">
      <rect x="46" y="58" width="100" height="76" rx="10" fill="#3B7CF6" opacity="0.18"/>
      <rect x="38" y="50" width="100" height="76" rx="10" fill="#2F6FED"/>
    </g>
  </g>
  <text x="80" y="260" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff">PixPress</text>
  <text x="80" y="330" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#EAF0FE">Compress photos. Save space.</text>
  <text x="80" y="378" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="34" font-weight="600" fill="#EAF0FE">Fit images under KB upload limits.</text>

  <g transform="translate(80,440)">
