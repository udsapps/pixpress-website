  </g>

  <g transform="translate(80,520)">
    <circle cx="12" cy="8" r="8" fill="#16A34A"/>
    <text x="32" y="14" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff">Compression works offline &#183; Free for Android</text>
  </g>
